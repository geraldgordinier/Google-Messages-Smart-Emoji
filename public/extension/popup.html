<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      width: 320px;
      padding: 16px;
      background: #ffffff;
      color: #333;
    }
    h2 {
      margin-top: 0;
      font-size: 16px;
      font-weight: 600;
      color: #1a1a1a;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    p {
      font-size: 13px;
      color: #666;
      line-height: 1.4;
      margin-bottom: 16px;
    }
    label {
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 6px;
      display: block;
      color: #444;
    }
    input {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 13px;
      box-sizing: border-box;
      margin-bottom: 12px;
      outline: none;
      transition: border 0.2s;
    }
    input:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
    }
    button {
      width: 100%;
      background: #3b82f6;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      font-size: 13px;
      transition: background 0.2s;
    }
    button:hover {
      background: #2563eb;
    }
    #status {
      font-size: 12px;
      margin-top: 10px;
      text-align: center;
      min-height: 18px;
    }
    .success {
      color: #16a34a;
    }
    .error {
      color: #dc2626;
    }
  </style>
</head>
<body>
  <h2>✨ Smart Emoji Setup</h2>
  <p>To generate context-aware emojis securely, enter your own Gemini API Key below.</p>
  
  <label for="apiKey">Gemini API Key</label>
  <input type="password" id="apiKey" placeholder="AIzaSy..." />
  
  <button id="saveBtn">Save Configuration</button>
  <div id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
